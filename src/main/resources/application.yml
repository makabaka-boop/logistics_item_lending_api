server:
  port: 8011
  servlet:
    context-path: /api

spring:
  application:
    name: item-lending-api
  datasource:
    url: jdbc:h2:file:/data/item-lending-db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

jwt:
  secret: logistics-item-lending-secret-key-2024-very-long-and-secure
  expiration: 86400000
  header: Authorization
  prefix: Bearer

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  packages-to-scan: com.logistics.itemlending.controller
  paths-to-match: /**

stock:
  warning:
    threshold: 3
    check-interval: 3600000

borrow:
  overdue:
    days: 7
    check-interval: 86400000

logging:
  level:
    com.logistics.itemlending: DEBUG
    org.springframework.security: DEBUG
