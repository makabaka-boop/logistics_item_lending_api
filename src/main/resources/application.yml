server:
  port: 8011

spring:
  application:
    name: logistics-item-lending
  datasource:
    url: jdbc:h2:file:/data/lendingdb;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

app:
  jwt:
    secret: logistics-item-lending-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm
    expiration-ms: 86400000
  warning:
    stock-threshold: 5
    overdue-days: 7
    abnormal-count-threshold: 3
